name: Test

on:
  push:
    branches:
      - "master"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "pypy-3.10"
          - "pypy-3.11"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install tox-gh-actions

      - name: Run tests
        run: tox

  test-examples:
    name: Example ${{ matrix.example }}
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ always() }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - example: django_demo
            python-version: "3.12"
            path: examples/django_demo
          - example: flask_alchemy
            python-version: "3.12"
            path: examples/flask_alchemy

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            .github/workflows/test.yml
            examples/requirements.txt
            ${{ matrix.path }}/requirements.txt

      - name: Check test prerequisites
        id: precheck
        shell: bash
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            echo "Core test job did not succeed, skipping example tests."
            exit 0
          fi

          case "${{ matrix.example }}" in
            django_demo)
              if find "${{ matrix.path }}" \( -name 'tests.py' -o -path '*/tests/*.py' \) | grep -q .; then
                echo "run-tests=true" >> "$GITHUB_OUTPUT"
              else
                echo "run-tests=false" >> "$GITHUB_OUTPUT"
                echo "No tests found for ${{ matrix.example }}, skipping."
              fi
              ;;
            flask_alchemy)
              if [ -d "${{ matrix.path }}/tests" ] || find "${{ matrix.path }}" -maxdepth 1 -name 'test_*.py' | grep -q .; then
                echo "run-tests=true" >> "$GITHUB_OUTPUT"
              else
                echo "run-tests=false" >> "$GITHUB_OUTPUT"
                echo "No tests found for ${{ matrix.example }}, skipping."
              fi
              ;;
            *)
              echo "run-tests=false" >> "$GITHUB_OUTPUT"
              echo "No workflow configured for ${{ matrix.example }}, skipping."
              ;;
          esac

      - name: Install example dependencies
        if: steps.precheck.outputs.run-tests == 'true'
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f ../requirements.txt ]; then
            python -m pip install -r ../requirements.txt
          fi
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          case "${{ matrix.example }}" in
            django_demo)
              python -m pip install "Django>=4.2"
              ;;
            flask_alchemy)
              python -m pip install Flask Flask-SQLAlchemy pytest
              ;;
          esac

      - name: Run example tests
        if: steps.precheck.outputs.run-tests == 'true'
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          case "${{ matrix.example }}" in
            django_demo)
              python manage.py test
              ;;
            flask_alchemy)
              if [ -d tests ]; then
                pytest tests/
              else
                pytest
              fi
              ;;
          esac
